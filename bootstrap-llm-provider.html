<!doctype html>
<html>

<head>
  <title>bootstrap-llm-provider</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <div class="container my-3">
    <div style="max-width: 25rem">
      <button id="basicConfig" class="m-1 btn btn-outline-dark">Basic Config</button>
      <button id="alwaysShowModal" class="m-1 btn btn-primary">Always Show Modal</button>
      <button id="customBaseURL" class="m-1 btn btn-success">Custom Base URL</button>
      <button id="customStorage" class="m-1 btn btn-danger">Custom Storage</button>
      <button id="customLabels" class="m-1 btn btn-secondary">Custom Labels</button>
      <button id="baseUrlsSelect" class="m-1 btn btn-info">Base URL Select</button>
      <button id="helpHtml" class="m-1 btn btn-warning">With Help</button>
      <button id="geminiConfig" class="m-1 btn btn-outline-primary">Gemini Config</button>
    </div>

    <pre id="result" class="p-3 text-bg-dark my-5">Results will appear here</pre>
  </div>

  <script type="module">
    // @ts-check
    import {
      geminiConfig,
      openaiConfig
    } from "./bootstrap-llm-provider.js";
    const resultElement = document.querySelector("#result");
    const attach = (id, options = {}, runner = openaiConfig) => {
      document.getElementById(id).addEventListener("click", () => {
        showResult({
          ...options
        }, runner);
      });
    };
    attach("basicConfig");
    attach("alwaysShowModal", {
      show: true
    });
    attach("customBaseURL", {
      defaultBaseUrls: ["https://api.openai.com/v1", "https://openrouter.ai/api/v1"],
      show: true
    });
    attach("customStorage", {
      storage: sessionStorage,
      key: "llmProvider",
      show: true
    });
    attach("customLabels", {
      storage: sessionStorage,
      key: "llmProvider",
      title: "Pick a provider",
      baseUrlLabel: "Your URL",
      apiKeyLabel: "Your Key",
      buttonLabel: "Save",
      show: true,
    });
    attach("baseUrlsSelect", {
      baseUrls: [{
          url: "https://api.openai.com/v1",
          name: "OpenAI"
        },
        {
          url: "https://openrouter.com/api/v1",
          name: "OpenRouter"
        },
      ],
      show: true,
    });
    attach("helpHtml", {
      help: '<div class="alert alert-info">Get your key from <a href="/">here</a></div>',
      show: true,
    });
    attach("geminiConfig", {}, geminiConfig);
    async function showResult(config = {}, runner = openaiConfig) {
      resultElement.textContent = "Checking...";
      try {
        const result = await runner(config);
        resultElement.textContent = JSON.stringify(result, null, 2);
      } catch (error) {
        resultElement.textContent = String(error);
      }
    }

  </script>
</body>

</html>
